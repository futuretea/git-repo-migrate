; github2gitlab 配置示例
; 复制为 github2gitlab.ini 并填入真实值；github2gitlab.ini 含令牌，不要提交到版本库

[github]
; 源实例根地址（GitHub Enterprise；API 地址自动取 <base_url>/api/v3）
; 裸域名会自动补 https:// 前缀
base_url =

; 源端 Personal Access Token：classic 需 repo 权限（枚举仓库 + 读取代码）
; 留空时读取环境变量 GHE_TOKEN（适合 CI，避免令牌落盘）
token =

; bare clone 协议：https = 令牌内嵌 URL；ssh = 依赖本机 SSH 配置与公钥
clone_protocol = https

[gitlab]
; 目标实例根地址（API 地址自动取 <base_url>/api/v4）
base_url =

; 目标端 Personal Access Token：需 api 权限（建项目 + 推送）
; 留空时读取环境变量 GITLAB_TOKEN
token =

; 推送协议：https = 令牌内嵌 URL；ssh = 依赖本机 SSH 配置与公钥
push_protocol = https

[run]
; bare clone 目录：每个仓库一个 {name}.git；清单 migrate-manifest.txt 与
; clone-only 写出的仓库名单 migrate-repos.json（供 --push-only 使用）也写在这里
clone_dir = .migrate-clones

[verify]
; 以下三项只被 verify_migration.py 读取（迁移脚本忽略）
; 源端 refs 来源：local-bare = clone_dir 下的本地 bare 仓库；api = [github] 段端点
source = local-bare

; 目标端 refs 来源：gitlab = [gitlab] 段端点；github = [github] 段端点
target = gitlab

; 核对清单来源：auto = <clone_dir>/migrate-manifest.txt；也可写显式路径
manifest = auto
