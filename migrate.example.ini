; codeup2github 配置示例
; 复制为 migrate.ini 并填入真实值；migrate.ini 含令牌，不要提交到版本库

[codeup]
; API 风格：
;   legacy = 老版 OpenAPI（GET /repository/list，organizationId+accessToken 参数）
;   oapi   = 新版 OAPI（GET /oapi/v1/codeup/...，x-yunxiao-token 头认证）
; 公有云标准版两者都可用；私有化部署建议先试 oapi，404 再试 legacy
api_style = oapi

; OpenAPI 服务地址（域名或完整 URL 均可，无需带 https:// 前缀）
; 公有云标准版：devops.cn-hangzhou.aliyuncs.com
; 私有化部署：你们的实例主域名，如 codeup.corp.example.com
api_domain =

; git 克隆服务地址（必填，无默认值：配错域名会浪费整轮迁移，fail-fast 更安全）
; 公有云标准版：codeup.aliyun.com
; 私有化部署：内网 git 域名
git_host =

; 企业 ID（organizationId）
; oapi 风格下留空时使用不带组织前缀的 Region 版端点（部分私有化部署）
; 也是仓库克隆地址的第一段，如 git@codeup.aliyun.com:<organization_id>/group/repo.git
organization_id =

; 个人访问令牌：云效个人设置 -> 个人访问令牌（需代码库读权限）
; 留空时读取环境变量 CODEUP_ACCESS_TOKEN（适合 CI，避免令牌落盘）
access_token =

; 要迁移的代码组路径（不含企业 ID），含子组，如 backend/team-a
; 留空表示迁移 token 可见的所有仓库
group_path =

; HTTPS 克隆认证用户名（令牌作为密码），一般为云效登录账号名
git_username =

; 内网私有化部署证书为自签时设为 true（跳过 API 和 git 的 TLS 证书校验）
insecure_tls = false

[github]
; GitHub 用户名（私有仓库建在该账号下）
; 同名仓库已存在时要求其可见性为私有（private=true 且 visibility=private，含 internal 也拒绝）：
; 不满足时该仓库记为失败并跳过，不会把私有历史推进公开仓库
username =

; Personal Access Token：classic 需 repo 权限；
; fine-grained 需 Administration + Contents 读写权限
; 留空时读取环境变量 GITHUB_TOKEN（适合 CI，避免令牌落盘）
token =

; GitHub Enterprise（私有化 GitHub）时设置这两项，github.com 保持默认：
;   api_base = https://<ghe-host>/api/v3
;   git_base = https://<ghe-host>
api_base = https://api.github.com
git_base = https://github.com

; push 改用 SSH 协议（git@host:user/repo.git），需账号已注册 SSH 公钥；
; HTTPS push 慢的环境（如内网 GHE）建议开启
push_ssh = false

[run]
; bare clone 临时目录
clone_dir = .migrate-clones

; 排除的 Codeup 仓库相对路径（不含企业 ID），逗号分隔，如 backend/legacy, tools/tmp
exclude =

; 选择模式一：组白名单（含子组），逗号分隔，如 backend,frontend
; 配置后只迁移这些组下的仓库 + my_creator_ids 创建的仓库；group_path 被忽略
include_groups =

; 选择模式二：你的 Codeup 数字 creatorId（仓库列表 API 返回的 creatorId 字段），逗号分隔
; 用于迁出散落在白名单组之外、由你创建的个人仓库
my_creator_ids =

; GitHub 仓库名前缀，如 codeup- 生成 codeup-demo-app
repo_prefix =
